services:
  adguardhome:
    image: adguard/adguardhome:v0.107.55
    container_name: adguardhome
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - adguard-work:/opt/adguardhome/work
      - adguard-conf:/opt/adguardhome/conf
    ports:
      - 53:53/tcp
      - 53:53/udp
    labels:
      - traefik.enable=true
      - "traefik.http.routers.adguard.rule=Host(`adguard.${DOMAIN}`)"
      - traefik.http.routers.adguard.entrypoints=websecure
      - traefik.http.routers.adguard.tls=true
      - traefik.http.services.adguard.loadbalancer.server.port=3000
    healthcheck:
      test: [CMD, wget, -qO-, http://localhost:3000]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.11.3
    container_name: nginx-proxy-manager
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt
    ports:
      - 8181:81
    labels:
      - traefik.enable=true
      - "traefik.http.routers.npm.rule=Host(`npm.${DOMAIN}`)"
      - traefik.http.routers.npm.entrypoints=websecure
      - traefik.http.routers.npm.tls=true
      - traefik.http.services.npm.loadbalancer.server.port=81
    healthcheck:
      test: [CMD-SHELL, wget -q --spider http://localhost:3000/api/health || exit 0]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  wireguard:
    image: ghcr.io/wg-easy/wg-easy:14
    container_name: wireguard
    restart: unless-stopped
    networks:
      - proxy
    environment:
      - WG_HOST=${WG_HOST}
      - PASSWORD=${WG_PASSWORD}
      - WG_PORT=${WG_PORT:-51820}
    volumes:
      - wireguard-data:/etc/wireguard
    ports:
      - "${WG_PORT:-51820}:51820/udp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    labels:
      - traefik.enable=true
      - "traefik.http.routers.wireguard.rule=Host(`vpn.${DOMAIN}`)"
      - traefik.http.routers.wireguard.entrypoints=websecure
      - traefik.http.routers.wireguard.tls=true
      - traefik.http.services.wireguard.loadbalancer.server.port=51821
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://localhost:51821/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  unbound:
    image: mvance/unbound:1.21.1
    container_name: unbound
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - unbound-conf:/opt/unbound/etc/unbound
    healthcheck:
      test: [CMD-SHELL, "drill @127.0.0.1 cloudflare.com || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  cloudflare-ddns:
    image: ghcr.io/favonia/cloudflare-ddns:1.14.0
    container_name: cloudflare-ddns
    restart: unless-stopped
    network_mode: host
    environment:
      - CF_API_TOKEN=${CF_API_TOKEN}
      - DOMAINS=${CF_RECORD_NAME}
      - PROXIED=false
    healthcheck:
      test: [CMD-SHELL, "pgrep -f cloudflare-ddns || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s


networks:
  proxy:
    external: true
volumes:
  adguard-work:
  adguard-conf:
  npm-data:
  npm-letsencrypt:
  wireguard-data:
  unbound-conf:
